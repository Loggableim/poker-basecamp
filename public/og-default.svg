<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a14"/>
      <stop offset="50%" stop-color="#160e20"/>
      <stop offset="100%" stop-color="#1a1430"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a844"/>
      <stop offset="100%" stop-color="#e2b714"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Suit symbols background -->
  <text x="90" y="140" font-family="serif" font-size="80" fill="#2a1a40" opacity="0.3">♠</text>
  <text x="280" y="100" font-family="serif" font-size="60" fill="#7a4a6a" opacity="0.2">♥</text>
  <text x="500" y="150" font-family="serif" font-size="70" fill="#2a1a40" opacity="0.25">♦</text>
  <text x="720" y="110" font-family="serif" font-size="65" fill="#7a4a6a" opacity="0.2">♣</text>
  <text x="950" y="140" font-family="serif" font-size="80" fill="#2a1a40" opacity="0.3">♠</text>
  <text x="1100" y="500" font-family="serif" font-size="60" fill="#7a4a6a" opacity="0.2">♥</text>
  <text x="100" y="550" font-family="serif" font-size="70" fill="#2a1a40" opacity="0.25">♦</text>
  <text x="600" y="560" font-family="serif" font-size="65" fill="#7a4a6a" opacity="0.2">♣</text>
  <!-- Main text -->
  <text x="600" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="2">♠ Poker Basecamp</text>
  <text x="600" y="380" font-family="'Inter', Arial, sans-serif" font-size="28" fill="#b098c8" text-anchor="middle" letter-spacing="4">BOT DEVELOPMENT &amp; GTO TOOLS</text>
  <!-- Bottom bar -->
  <rect x="300" y="420" width="600" height="2" fill="#7a4a6a" opacity="0.5"/>
</svg>
